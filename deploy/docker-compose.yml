# Прод-стек одного сервера: Postgres + API + Caddy (HTTPS, фронт, /api -> API).
# Лежит на сервере в /opt/opt_catalog рядом с api/ (код бэкенда), web/ (сборка
# фронта), Caddyfile и .env. Выкатка — deploy/deploy.sh с машины разработчика.
services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Один процесс uvicorn: воркер доставки уведомлений живёт в lifespan,
    # несколько воркеров отправляли бы каждое сообщение по нескольку раз.
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
